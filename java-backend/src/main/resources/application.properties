# Server Configuration
server.port=${PORT:3000}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Application Name
spring.application.name=workflow-saas
spring.profiles.active=${NODE_ENV:production}

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/workflow_saas}
spring.datasource.username=${DB_USER:user}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:your-secret-key-change-in-production}

# Camunda Configuration
camunda.rest.url=${CAMUNDA_REST_URL:http://localhost:8080/engine-rest}

# CORS Configuration
cors.allowed.origins=${CORS_ORIGINS:http://localhost:5173}

# Logging Configuration
logging.level.root=INFO
logging.level.com.workflowsaas=DEBUG

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.server.port=${PORT:3000}

# Security Headers
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
