# Server Configuration
server.port=${PORT:3000}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Application Name
spring.application.name=workflow-saas
spring.profiles.active=${NODE_ENV:production}

# Application Configuration
app.profile=${NODE_ENV:production}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/workflow_saas}
spring.datasource.username=${DB_USER:user}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Liquibase Configuration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true

# JWT Configuration
jwt.secret=${JWT_SECRET:your-secret-key-change-in-production}

# Camunda Configuration (Embedded Engine)
camunda.bpm.admin-user.id=admin
camunda.bpm.admin-user.password=admin
camunda.bpm.admin-user.firstName=Admin
camunda.bpm.filter.create=All tasks
camunda.bpm.history-level=full
camunda.bpm.history-time-to-live=P180D
camunda.bpm.database.schema-update=true
camunda.bpm.generic-properties.properties.history-cleanup-batch-window-start-time=00:00
camunda.bpm.generic-properties.properties.history-cleanup-batch-window-end-time=06:00

# Disable Camunda authorization (security disabled for development)
camunda.bpm.authorization.enabled=false
camunda.bpm.webapp.application-path=/

# Logging Configuration
logging.level.root=INFO
logging.level.com.workflowsaas=DEBUG

# JPA Configuration
spring.jpa.open-in-view=false

# Actuator Configuration
# Expose all actuator endpoints for full monitoring
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.server.port=${PORT:3000}

# Enable additional actuator endpoints
management.endpoint.env.show-values=always
management.endpoint.configprops.show-values=always

# Security Headers
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
