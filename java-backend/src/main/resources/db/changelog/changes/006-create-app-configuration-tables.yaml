databaseChangeLog:
  - changeSet:
      id: 006-create-app-configurations-table
      author: system
      changes:
        - createTable:
            tableName: app_configurations
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
                  defaultValueComputed: gen_random_uuid()
              - column:
                  name: tenant_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: app_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: source
                  type: varchar(10)
                  constraints:
                    nullable: false
              - column:
                  name: parameters_filename
                  type: varchar(255)
              - column:
                  name: parameters_content
                  type: text
              - column:
                  name: model_filename
                  type: varchar(255)
              - column:
                  name: model_content
                  type: text
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
                  defaultValueComputed: NOW()
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false
                  defaultValueComputed: NOW()
        
        - sql:
            sql: ALTER TABLE app_configurations ADD CONSTRAINT check_source_value CHECK (source IN ('eeh', 'api'))
        
        - addUniqueConstraint:
            tableName: app_configurations
            columnNames: app_id
            constraintName: unique_config_per_app
        
        - addForeignKeyConstraint:
            baseTableName: app_configurations
            baseColumnNames: tenant_id
            constraintName: fk_app_config_tenant
            referencedTableName: tenants
            referencedColumnNames: id
            onDelete: CASCADE
        
        - addForeignKeyConstraint:
            baseTableName: app_configurations
            baseColumnNames: app_id
            constraintName: fk_app_config_app
            referencedTableName: apps
            referencedColumnNames: id
            onDelete: CASCADE
        
        - createIndex:
            tableName: app_configurations
            indexName: idx_app_config_tenant_id
            columns:
              - column:
                  name: tenant_id
        
        - createIndex:
            tableName: app_configurations
            indexName: idx_app_config_app_id
            columns:
              - column:
                  name: app_id

