databaseChangeLog:
  - changeSet:
      id: 003-add-tenant-features
      author: system
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: tenants
                columnName: features
      changes:
        - addColumn:
            tableName: tenants
            columns:
              - column:
                  name: features
                  type: jsonb
              - column:
                  name: onboarding_completed
                  type: boolean
                  defaultValueBoolean: false
