# Test Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Liquibase - disable for tests
spring.liquibase.enabled=false

# JWT Configuration
jwt.secret=test-secret-key-for-testing-purposes-only-min-256-bits

# Camunda - disable for tests
camunda.bpm.enabled=false
spring.autoconfigure.exclude=org.camunda.bpm.spring.boot.starter.CamundaBpmAutoConfiguration

# CORS Configuration
cors.allowed.origins=http://localhost:5173

# Logging
logging.level.root=WARN
logging.level.com.workflowsaas=INFO

# Actuator Configuration for Tests
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
