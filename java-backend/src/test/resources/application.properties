# Test Configuration - Default for all tests
# Use PostgreSQL for integration tests to match production
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/workflow_saas}
spring.datasource.username=${DB_USER:user}
spring.datasource.password=${DB_PASSWORD:password}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Liquibase
spring.liquibase.enabled=true

# JWT Configuration
jwt.secret=test-secret-key-for-testing-purposes-only-min-256-bits

# Camunda - enabled for integration tests
camunda.bpm.admin-user.id=admin
camunda.bpm.admin-user.password=admin

# CORS Configuration
cors.allowed.origins=http://localhost:5173

# Actuator Configuration - Expose all endpoints for testing
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

# Logging
logging.level.root=WARN
logging.level.com.workflowsaas=INFO
